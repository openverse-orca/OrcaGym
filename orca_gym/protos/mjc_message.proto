// ============= DebugMesh 公共类型 =============

// 与 OrcaDebugMeshTypes.h MeshType 枚举严格对应，顺序不可变
enum DebugMeshType {
    DEBUG_MESH_SPHERE   = 0;
    DEBUG_MESH_CYLINDER = 1;
    DEBUG_MESH_CONE     = 2;
    DEBUG_MESH_BOX      = 3;
    DEBUG_MESH_QUAD     = 4;  // double-sided
    DEBUG_MESH_ARROW    = 5;
}

// 单个实例数据，与 C++ MeshInstance 结构严格对应
// 使用分解变换（pos/quat/scale）而非矩阵，便于 Python 侧构造
// 坐标系规范见设计文档 §2.3：Z-up 右手系，单位米，四元数 [x,y,z,w]
//   - position/rotation 与 MuJoCo/O3DE 一致，各层 API 之间零转换直通
//   - rotation 用 [x,y,z,w]（O3DE 原生），非 MuJoCo 的 [w,x,y,z]
//     Python 侧从 MuJoCo data.xquat 取值时需用 quat_mujoco_to_grpc() 重排
message DebugMeshInstance {
    repeated float position = 1;  // [x, y, z] Z-up 世界坐标，单位米
    repeated float rotation = 2;  // [x, y, z, w] 四元数（非 MuJoCo 的 [w,x,y,z]）
    repeated float scale    = 3;  // [sx, sy, sz] 各轴缩放
    repeated float color    = 4;  // [r, g, b, a] 0..1
    uint32 flags            = 5;  // InstanceFlags bitmask (bit0 = EdgeHighlight, bit1 = Wireframe)
}

// 持久化对象句柄，与 C++ ObjectHandle (index + generation) 对应
message DebugMeshHandle {
    uint32 index      = 1;
    uint32 generation = 2;  // 0 = invalid
}

// ============= Immediate 模式（单帧 + TTL） =============

// duration_seconds = 0：单帧（默认，本帧渲染后自动清除）
// duration_seconds > 0：TTL 持续时长（秒），实例跨帧存活至仿真时间到期，
//   避免高频重提交导致的闪烁。详见 OrcaDebugMesh 架构设计 §4.3.1。
message DrawDebugMeshBatchRequest {
    DebugMeshType mesh_type        = 1;
    repeated DebugMeshInstance instances = 2;  // 同类型实例列表
    float duration_seconds         = 3;  // 持续时长（秒，fp32，默认 0=单帧）
}
message DrawDebugMeshBatchResponse {
    bool   success       = 1;
    string error_message = 2;
    uint32 drawn_count   = 3;  // 实际入队数量
}

message ClearDebugMeshRequest {}
message ClearDebugMeshResponse {
    bool success = 1;
}

// ============= Retained 模式（跨帧持久 + Keepalive） =============

// keepalive_seconds：保活时长（秒，默认 1.0）。对象在此时长内未收到任何
//   Update*/KeepAlive 则自动销毁。用于断连/崩溃等异常场景的残留清理。
//   详见 OrcaDebugMesh 架构设计 §11.9。
message CreateDebugMeshObjectsRequest {
    DebugMeshType mesh_type        = 1;
    repeated DebugMeshInstance instances = 2;
    float keepalive_seconds        = 3;  // 保活时长（秒，fp32，默认 1.0）
}
message CreateDebugMeshObjectsResponse {
    bool   success       = 1;
    string error_message = 2;
    repeated DebugMeshHandle handles = 3;  // 与 instances 顺序一致，失败项为 invalid
}

message UpdateDebugMeshTransformsRequest {
    repeated DebugMeshHandle handles    = 1;
    repeated DebugMeshInstance instances = 2;  // 与 handles 顺序一致，全量替换实例数据
    // ⚠️ Update 同时刷新保活计时器（隐式保活），高频更新对象无需额外心跳。
}
message UpdateDebugMeshTransformsResponse {
    bool   success       = 1;
    string error_message = 2;
    uint32 updated_count = 3;
}

// 保活心跳：刷新指定 handle 的保活计时器，不修改 transform。
// 用于"对象位置不变但仍需保活"的场景（如静态标注点）。开销极低（无 GPU 操作）。
// 返回 alive/expired 双列表，调用方据此修剪本地 handle 列表。
message KeepAliveDebugMeshObjectsRequest {
    repeated DebugMeshHandle handles = 1;
}
message KeepAliveDebugMeshObjectsResponse {
    bool   success       = 1;
    string error_message = 2;
    repeated DebugMeshHandle alive_handles   = 3;  // 仍存活（已刷新）
    repeated DebugMeshHandle expired_handles = 4;  // 已过期/无效
}

message DestroyDebugMeshObjectsRequest {
    repeated DebugMeshHandle handles = 1;
}
message DestroyDebugMeshObjectsResponse {
    bool   success       = 1;
    string error_message = 2;
    uint32 destroyed_count = 3;
}

message QueryDebugMeshCountRequest {}
message QueryDebugMeshCountResponse {
    uint32 retained_count  = 1;
    uint32 immediate_count = 2;
}

// ============= Custom Mesh (Phase C/O) =============
// 自定义网格句柄，与 OrcaDebugMesh::CustomMeshHandle 严格对应
message CustomMeshHandle {
    uint32 index      = 1;
    uint32 generation = 2;  // 0 表示无效（注册失败等）
}

// OBJ 加载选项（与 OrcaDebugMesh::ObjLoadOptions 严格对应）
message ObjLoadOptions {
    bool   y_up              = 1;  // true: 源数据 Y-up，旋转到 Z-up；false: 已是 Z-up
    bool   flip_winding      = 2;  // true: 翻转索引绕序（CCW→CW）
    bool   recenter          = 3;  // true: 平移使 AABB 居中于原点
    bool   normalize_scale   = 4;  // true: 缩放使最长边 = 1
}

// RegisterCustomMesh：直接传顶点 + 索引
message RegisterCustomMeshRequest {
    // 顶点位置，3 float per vertex，紧密排列
    repeated float positions = 1;
    // 索引（三角形列表），3 uint32 per face
    repeated uint32 indices  = 2;
    // AABB 包围盒（6 float：min[3] + max[3]），可选；为空则 C++ 侧自动计算
    repeated float aabb      = 3;
    // 可选法线，3 float per vertex；为空则 C++ 侧不使用法线
    repeated float normals   = 4;
}
message RegisterCustomMeshResponse {
    bool           success       = 1;
    string         error_message = 2;
    CustomMeshHandle handle      = 3;
    uint32         vertex_count  = 4;
    uint32         face_count    = 5;
}

// RegisterCustomMeshFromObj：传 OBJ 文件文本
message RegisterCustomMeshFromObjRequest {
    string          obj_text = 1;  // OBJ 文件全文
    ObjLoadOptions  options  = 2;
}
message RegisterCustomMeshFromObjResponse {
    bool           success       = 1;
    string         error_message = 2;
    CustomMeshHandle handle      = 3;
    uint32         vertex_count  = 4;
    uint32         face_count    = 5;
}

message UnregisterCustomMeshRequest {
    CustomMeshHandle handle = 1;
}
message UnregisterCustomMeshResponse {
    bool   success       = 1;
    string error_message = 2;
}

// DrawCustomMeshBatch：绘制已注册的自定义网格
message DrawCustomMeshBatchRequest {
    CustomMeshHandle handle    = 1;  // 已注册的自定义网格句柄
    repeated DebugMeshInstance instances = 2;  // 实例列表
    float duration_seconds     = 3;  // TTL：0=单帧，>0 跨帧存活
}
message DrawCustomMeshBatchResponse {
    bool   success       = 1;
    string error_message = 2;
    uint32 drawn_count   = 3;
}